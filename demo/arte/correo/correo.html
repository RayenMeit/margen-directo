<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600">

<title>Captura para correo · vista 3</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="correo.css">
</head>
<body>
<!-- Fuente de la imagen captura-correo-1200.png (600 px de diseño × 2). Todo el texto es HTML; la imagen se exporta con Playwright. -->
<div class="pieza">
  <div class="cab">
    <img src="../logotipo/bs-logo-horizontal-fondo-oscuro.svg" alt="" width="140" height="25">
    <span class="e e-verde">Ejemplo con datos ficticios</span>
  </div>
  <p class="proy">Margen Directo · Festival Ría Norte 2026</p>
  <div class="dos">
    <div class="col">
      <p class="lab"><span class="e e-verde">2026</span> Lo que te quedó</p>
      <p class="cifra grande verde">21.579 €</p>
      <p class="sub">corregido solo con lo confirmado<br><span class="cifra">18.723 € + 2.856 €</span></p>
    </div>
    <div class="col">
      <p class="lab"><span class="e e-verde">2027</span> Lo que te va a quedar</p>
      <p class="cifra grande">20.991 €</p>
      <p class="sub">con los precios corregidos, antes del colchón</p>
    </div>
  </div>
  <p class="colchon"><span class="e e-papel">Colchón 8 %</span> <span class="cifra">−8.229 €</span> <span class="flecha">apartado para imprevistos</span> <span class="cifra fin">= 12.762 €</span></p>
</div>
</body>
