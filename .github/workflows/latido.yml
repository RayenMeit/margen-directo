# Latido cada 2 dias para que el proyecto gratuito de Supabase no se pause por inactividad.
# Usa la clave PUBLICA (publishable). La funcion ping() solo inserta una marca de tiempo.
name: latido-supabase
on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a ping()
        run: |
          r=$(curl -sS -w " %{http_code}" -X POST "https://tovyggiuyofqthpcvcle.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_kOMT6OayT5okpvmv9IK-Uw_h0LKy5Xx" \
            -H "Content-Type: application/json" -d '{"fuente":"github-action"}')
          echo "$r"
          echo "$r" | grep -q '"ok" 200'
