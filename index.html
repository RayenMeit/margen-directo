<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Margen Directo · Brain Streaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0D26;--bg2:#121538;--bg3:#1A1E4A;--line:#262B5E;--tx:#E8EAF6;--tx2:#9DA3C7;--ac:#00E676;--ac2:#00B85C;--warn:#FFB300;--bad:#FF5252;--ok:#00E676;--r:12px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Space Grotesk",system-ui,sans-serif}
a{color:var(--ac)}button{font:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:5}
header .logo{font-weight:700;letter-spacing:.3px}header .logo b{color:var(--ac)}
header .sp{flex:1}header .who{color:var(--tx2);font-size:13px}
.btn{border:1px solid var(--line);background:var(--bg3);color:var(--tx);padding:8px 14px;border-radius:9px}
.btn:hover{border-color:var(--ac)}.btn.pri{background:var(--ac);color:#06281A;border-color:var(--ac);font-weight:700}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}.btn.ghost{background:transparent}
main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
h1{font-size:26px;margin:0 0 6px}h2{font-size:18px;margin:0 0 10px}h3{font-size:14px;margin:0 0 6px;color:var(--tx2);font-weight:500;text-transform:uppercase;letter-spacing:.6px}
.sub{color:var(--tx2);margin:0 0 18px}
.kpi{font-size:30px;font-weight:700;line-height:1.1}.kpi.small{font-size:22px}
.kpi .u{font-size:14px;color:var(--tx2);font-weight:400;margin-left:4px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mid{color:var(--warn)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{border:1px solid transparent;background:transparent;color:var(--tx2);padding:8px 14px;border-radius:9px;text-decoration:none}
.tab.on{background:var(--bg3);color:var(--tx);border-color:var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--tx2);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td.n,th.n{text-align:right;font-family:"JetBrains Mono",monospace;white-space:nowrap}
.bar{height:8px;background:var(--bg3);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--tx2)}
.pill.alta{border-color:var(--bad);color:var(--bad)}.pill.media{border-color:var(--warn);color:var(--warn)}.pill.nota{color:var(--tx2)}
.pill.confirmado{border-color:var(--ok);color:var(--ok)}.pill.justificado,.pill.no_aplica{opacity:.6}
.aviso{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.aviso .t{font-weight:500}.aviso .d{color:var(--tx2);font-size:13px;margin-top:3px}
.aviso .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;justify-content:flex-end}
.list a.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--tx);text-decoration:none}
.list a.row:hover .nm{color:var(--ac)}.list .meta{color:var(--tx2);font-size:13px}
.demo{background:#2B2300;border:1px solid #6B5800;color:#FFD54F;padding:8px 12px;border-radius:9px;font-size:13px;margin-bottom:14px}
.login{max-width:440px;margin:70px auto}.login input{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:var(--bg3);color:var(--tx);font:inherit;margin:10px 0}
.msg{color:var(--tx2);font-size:13px;margin-top:8px}.err{color:var(--bad)}
.hook{font-size:13px;color:var(--tx2);border-left:3px solid var(--ac);padding-left:10px;margin:0 0 20px}
.crumb{color:var(--tx2);font-size:13px;margin-bottom:8px}.crumb a{color:var(--tx2);text-decoration:none}.crumb a:hover{color:var(--ac)}
.foot{color:var(--tx2);font-size:12px;margin-top:40px;border-top:1px solid var(--line);padding-top:12px}
.tag{font-size:11px;color:var(--tx2);font-family:"JetBrains Mono",monospace}
@media (max-width:640px){.aviso{grid-template-columns:1fr}.aviso .acts{justify-content:flex-start}header{padding:10px 12px}.kpi{font-size:24px}}
</style>
</head>
<body>
<header>
  <div class="logo">Margen <b>Directo</b> <span class="tag">v0 boceto</span></div>
  <div class="sp"></div>
  <div class="who" id="who"></div>
  <button class="btn sm ghost" id="logout" hidden>Salir</button>
</header>
<main id="app"><div class="card">Cargando…</div></main>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/+esm";
const SUPABASE_URL = "https://tovyggiuyofqthpcvcle.supabase.co";
const SUPABASE_KEY = "sb_publishable_kOMT6OayT5okpvmv9IK-Uw_h0LKy5Xx";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (s, el=document) => el.querySelector(s);
const app = $("#app");
const eur = v => (v==null||isNaN(v)) ? "—" : new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(v);
const eur2 = v => (v==null||isNaN(v)) ? "—" : new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2}).format(v);
const pct = v => (v==null||isNaN(v)) ? "—" : new Intl.NumberFormat("es-ES",{maximumFractionDigits:1}).format(v)+" %";
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fecha = d => d ? new Date(d+"T00:00:00").toLocaleDateString("es-ES",{day:"2-digit",month:"short",year:"numeric"}) : "—";
const HOOK = "Lo que te quedó del último evento. Lo que te va a quedar del siguiente.";
let S = { user:null, perfil:null, route:{}, cache:{} };

// ---------- enrutado por hash: #/ · #/org/<id> · #/p/<id>/<tab>
function parse(){ const h=location.hash.replace(/^#\/?/,""); const p=h.split("/"); return {kind:p[0]||"", id:p[1]||null, tab:p[2]||null}; }
window.addEventListener("hashchange", render);

// ---------- sesión
let booting=false;
sb.auth.onAuthStateChange((_e, session)=>{ const had=!!S.user; S.user = session?.user||null; if(had!==!!S.user) boot(); });
async function boot(){
  if(booting) return; booting=true; try{ await boot2(); } finally { booting=false; }
}
async function boot2(){
  const { data:{ session } } = await sb.auth.getSession();
  S.user = session?.user||null;
  if(!S.user){ $("#who").textContent=""; $("#logout").hidden=true; return renderLogin(); }
  const { data:perfil, error } = await sb.from("perfiles").select("id,rol,nombre,org_id").eq("id", S.user.id).maybeSingle();
  if(error){ return showError("No se pudo leer tu perfil: "+error.message); }
  S.perfil = perfil;
  $("#who").textContent = `${perfil?.nombre||S.user.email} · ${perfil?.rol||"?"}`;
  $("#logout").hidden=false;
  render();
}
$("#logout").onclick = async ()=>{ await sb.auth.signOut(); location.hash=""; };

function renderLogin(msg="", err=false){
  app.innerHTML = `<div class="login card">
    <h1>Margen <span style="color:var(--ac)">Directo</span></h1>
    <p class="hook">${HOOK}</p>
    <p class="sub">Entra con tu correo. Te enviamos un enlace de acceso; no hay contraseña.</p>
    <form id="f"><input type="email" required placeholder="tu@correo.es" autocomplete="email"><button class="btn pri" style="width:100%">Enviarme el enlace</button></form>
    <div class="msg ${err?"err":""}">${esc(msg)}</div>
    <p class="foot">Brain Streaming, S.L. · Los datos se guardan en la UE (Frankfurt). Acceso solo por invitación.</p>
  </div>`;
  $("#f").onsubmit = async e=>{
    e.preventDefault();
    const email = $("#f input").value.trim();
    const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin+location.pathname, shouldCreateUser:false } });
    if(error) renderLogin(/not allowed|not found/i.test(error.message) ? "Ese correo no tiene acceso. Pide la invitación a diego@brainstreaming.es." : error.message, true);
    else renderLogin("Enlace enviado a "+email+". Revisa el correo (y la carpeta de spam).");
  };
}
function showError(m){ app.innerHTML = `<div class="card err">${esc(m)}</div>`; }

// ---------- render principal
async function render(){
  if(!S.user) return;
  S.route = parse();
  if(S.route.kind==="p" && S.route.id) return renderProyecto(S.route.id, S.route.tab||"cierre");
  if(S.route.kind==="org" && S.route.id) return renderOrg(S.route.id);
  return renderHome();
}

async function renderHome(){
  const admin = S.perfil?.rol==="admin";
  const q = sb.from("organizaciones").select("id,nombre,tipo,zona,es_demo,proyectos(id,nombre,tipo,estado,fecha_inicio,fecha_fin)").order("nombre");
  const { data:orgs, error } = await q;
  if(error) return showError(error.message);
  if(!admin && orgs?.length===1 && orgs[0].proyectos?.length===1){ location.hash = `#/p/${orgs[0].proyectos[0].id}/cierre`; return; }
  app.innerHTML = `<h1>${admin?"Cartera":"Tus proyectos"}</h1><p class="hook">${HOOK}</p>
  <div class="grid g2">${(orgs||[]).map(o=>`<div class="card">
    ${o.es_demo?`<div class="demo">Datos ficticios de demostración</div>`:""}
    <h2>${esc(o.nombre)}</h2><div class="meta" style="color:var(--tx2);font-size:13px;margin-bottom:8px">${esc(o.tipo||"")} · ${esc(o.zona||"")}</div>
    <div class="list">${(o.proyectos||[]).sort((a,b)=>(b.fecha_inicio||"").localeCompare(a.fecha_inicio||"")).map(p=>`<a class="row" href="#/p/${p.id}/cierre"><span class="nm">${esc(p.nombre)}</span><span class="meta">${esc(p.tipo)} · ${esc(p.estado)} · ${fecha(p.fecha_inicio)}</span></a>`).join("")||`<div class="meta">Sin proyectos</div>`}</div>
  </div>`).join("")||`<div class="card">No hay nada asignado a tu usuario todavía.</div>`}</div>
  ${foot()}`;
}
async function renderOrg(id){ location.hash="#/"; }

function foot(){ return `<p class="foot">Estimaciones a partir de los documentos cargados y de una base de precios del sector; no es contabilidad ni sustituye a la gestoría. Solo lo confirmado cuenta.</p>`; }

async function renderProyecto(pid, tab){
  const admin = S.perfil?.rol==="admin";
  const { data:p, error } = await sb.from("proyectos").select("*, organizaciones(id,nombre,zona,es_demo)").eq("id",pid).maybeSingle();
  if(error||!p) return showError(error?.message||"Proyecto no encontrado");
  const tabs = [["cierre","Cierre · lo que te quedó"],["plan","Plan · lo que te va a quedar"],["mes","Mes · avisos y sorpresas"],["lineas","Líneas y documentos"]];
  app.innerHTML = `<div class="crumb"><a href="#/">${admin?"Cartera":"Inicio"}</a> › ${esc(p.organizaciones?.nombre||"")}</div>
  ${p.organizaciones?.es_demo?`<div class="demo">Ejemplo ficticio para demostración. Ninguna cifra corresponde a un cliente real.</div>`:""}
  <h1>${esc(p.nombre)}</h1><p class="sub">${esc(p.tipo)} · ${esc(p.estado)} · ${fecha(p.fecha_inicio)}${p.fecha_fin&&p.fecha_fin!==p.fecha_inicio?" → "+fecha(p.fecha_fin):""}</p>
  <div class="tabs">${tabs.map(([k,l])=>`<a class="tab ${k===tab?"on":""}" href="#/p/${pid}/${k}">${l}</a>`).join("")}</div>
  <div id="panel"><div class="card">Cargando…</div></div>${foot()}`;
  const panel = $("#panel");
  if(tab==="cierre") return tabCierre(p, panel);
  if(tab==="plan") return tabPlan(p, panel, admin);
  if(tab==="mes") return tabMes(p, panel, admin);
  if(tab==="lineas") return tabLineas(p, panel, admin);
}

async function tabCierre(p, panel){
  const { data:c, error } = await sb.rpc("cierre_proyecto", { pid:p.id });
  if(error) return panel.innerHTML=`<div class="card err">${esc(error.message)}</div>`;
  const m = c.margen_pct; const cls = m>=20?"pos":m>=15?"mid":"neg";
  const maxF = Math.max(...(c.por_familia||[]).map(f=>f.importe),1);
  panel.innerHTML = `<div class="grid g3">
    <div class="card"><h3>Lo que entró</h3><div class="kpi">${eur(c.ingresos)}</div></div>
    <div class="card"><h3>Lo que salió</h3><div class="kpi">${eur(c.costes)}</div></div>
    <div class="card"><h3>Lo que te quedó</h3><div class="kpi ${cls}">${eur(c.resultado)}</div><div class="meta" style="color:var(--tx2)">margen ${pct(m)} sobre ingreso${c.resultado_corregido!=null&&c.resultado_corregido!==c.resultado?` · corregido con avisos confirmados: <b>${eur(c.resultado_corregido)}</b>`:""}</div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h2>Dónde se fue el dinero</h2><table>${(c.por_familia||[]).map(f=>`<tr><td>${esc(f.familia)}</td><td style="width:40%"><div class="bar"><i style="width:${Math.round(f.importe/maxF*100)}%"></i></div></td><td class="n">${eur(f.importe)}</td><td class="n" style="color:var(--tx2)">${pct(f.importe/c.costes*100)}</td></tr>`).join("")}</table></div>
    <div class="card"><h2>Por sede o fecha</h2><table><tr><th>Sede</th><th class="n">Entró</th><th class="n">Salió</th><th class="n">Quedó</th></tr>${(c.por_sede||[]).map(s=>`<tr><td>${esc(s.sede)}<div class="meta" style="color:var(--tx2);font-size:12px">${fecha(s.fecha)} · ${esc(s.ciudad||"")}${s.aforo?" · aforo "+s.aforo:""}</div></td><td class="n">${eur(s.ingresos)}</td><td class="n">${eur(s.costes)}</td><td class="n ${s.resultado>=0?"pos":"neg"}">${eur(s.resultado)}</td></tr>`).join("")}</table>
    <h2 style="margin-top:18px">Avisos</h2>
    <div class="grid g3"><div><h3>Detectados</h3><div class="kpi small">${c.avisos?.detectados??0}<span class="u">${eur(c.avisos?.eur_detectado)}</span></div></div><div><h3>Confirmados</h3><div class="kpi small pos">${c.avisos?.confirmados??0}<span class="u">${eur(c.avisos?.eur_confirmado)}</span></div></div><div><h3>Sorpresas</h3><div class="kpi small mid">${c.incidencias?.n??0}<span class="u">${eur(c.incidencias?.eur_nosotros)} asumidas</span></div></div></div>
    <p class="msg">Lo detectado es una pista; solo lo confirmado se resta del resultado. <a href="#/p/${p.id}/mes">Revisar avisos →</a></p></div>
  </div>`;
}

async function tabPlan(p, panel, admin){
  const { data:planes, error } = await sb.from("planes").select("*").eq("basado_en", p.id).order("creado",{ascending:false});
  if(error) return panel.innerHTML=`<div class="card err">${esc(error.message)}</div>`;
  if(!planes?.length){
    panel.innerHTML = `<div class="card"><h2>Todavía no hay plan para el siguiente evento</h2><p class="sub">El plan parte del cierre: cada partida de este evento, con su precio de referencia donde hubo aviso confirmado, más un colchón de imprevistos.</p>${admin?`<button class="btn pri" id="gp">Generar plan con colchón del 8 %</button>`:`<p class="msg">Diego lo prepara tras el cierre.</p>`}</div>`;
    if(admin) $("#gp").onclick = async ()=>{ const { error } = await sb.rpc("generar_plan",{ pid:p.id, nombre_plan:`${p.nombre} · siguiente edición (previsión)`, colchon:8 }); if(error) alert(error.message); else tabPlan(p,panel,admin); };
    return;
  }
  const pl = planes[0];
  const [{ data:r, error:e1 }, { data:ls, error:e2 }] = await Promise.all([ sb.rpc("resumen_plan",{ plid:pl.id }), sb.from("plan_lineas").select("*").eq("plan_id",pl.id).order("importe",{ascending:false}) ]);
  if(e1||e2) return panel.innerHTML=`<div class="card err">${esc((e1||e2).message)}</div>`;
  const res = r.resultado_previsto; const cls = res>=0 ? (res/(r.ingresos_previstos||1)>=0.15?"pos":"mid") : "neg";
  const rk = {asumir:"Asumir",vigilar:"Vigilar",mitigar:"Mitigar"};
  panel.innerHTML = `<div class="card" style="margin-bottom:14px"><h2>${esc(pl.nombre)}</h2><div class="meta" style="color:var(--tx2)">Estado: ${esc(pl.estado)} · colchón ${pct(r.colchon_pct)} ${pl.fecha_prevista?" · fecha prevista "+fecha(pl.fecha_prevista):""}</div></div>
  <div class="grid g3">
    <div class="card"><h3>Ingresos previstos</h3><div class="kpi">${eur(r.ingresos_previstos)}</div><div class="msg">mismo nivel que el último evento; edítalo cuando tengas el presupuesto de venta</div></div>
    <div class="card"><h3>Costes previstos + colchón</h3><div class="kpi">${eur(r.costes_previstos+r.colchon_eur)}</div><div class="msg">${eur(r.costes_previstos)} + ${eur(r.colchon_eur)} de imprevistos</div></div>
    <div class="card"><h3>Lo que te va a quedar</h3><div class="kpi ${cls}">${eur(res)}</div><div class="msg">estimación con colchón, no garantía</div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h2>Riesgo por partida</h2><table><tr><th>Criterio</th><th class="n">Partidas</th><th class="n">Importe</th></tr>${(r.por_riesgo||[]).map(x=>`<tr><td><span class="pill ${x.riesgo==="mitigar"?"alta":x.riesgo==="vigilar"?"media":""}">${rk[x.riesgo]||x.riesgo}</span></td><td class="n">${x.n}</td><td class="n">${eur(x.importe)}</td></tr>`).join("")}</table>
    <p class="msg"><b>Asumir:</b> precio en línea con el sector. <b>Vigilar:</b> pide una segunda oferta antes de firmar. <b>Mitigar:</b> hubo aviso confirmado: ya va al precio de referencia; cámbialo de proveedor o negocia.</p></div>
    <div class="card"><h2>Partidas del plan</h2><table><tr><th>Partida</th><th>Riesgo</th><th class="n">Importe</th></tr>${(ls||[]).map(l=>`<tr><td>${esc(l.descripcion)}<div class="meta" style="color:var(--tx2);font-size:12px">${esc(l.familia)} · ${l.cantidad} ${esc(l.unidad)} × ${l.dias} d × ${eur2(l.precio_unit)}${l.nota?" · "+esc(l.nota):""}</div></td><td><span class="pill ${l.riesgo==="mitigar"?"alta":l.riesgo==="vigilar"?"media":""}">${rk[l.riesgo]||l.riesgo}</span></td><td class="n">${eur(l.importe)}</td></tr>`).join("")}</table></div>
  </div>`;
}

async function tabMes(p, panel, admin){
  const [{ data:av, error:e1 }, { data:inc, error:e2 }] = await Promise.all([
    sb.from("avisos").select("*").eq("proyecto_id",p.id).not("codigo","like","%-OLD").order("eur_riesgo",{ascending:false}),
    sb.from("incidencias").select("*").eq("proyecto_id",p.id).order("importe_est",{ascending:false}) ]);
  if(e1||e2) return panel.innerHTML=`<div class="card err">${esc((e1||e2).message)}</div>`;
  const estados = [["confirmado","Confirmar"],["justificado","Justificar"],["no_aplica","No aplica"],["detectado","Reabrir"]];
  const asume = {nosotros:"lo asumimos nosotros",proveedor:"lo asume el proveedor",recinto:"lo asume el recinto",seguro:"va al seguro",no_se:"sin decidir"};
  panel.innerHTML = `<div class="grid g2">
    <div class="card"><h2>Avisos antes de firmar el siguiente</h2><p class="msg">Cada aviso compara una línea con la base de precios del sector o detecta un documento repetido. ${admin?"Confírmalo, justifícalo o descártalo.":"Diego los revisa contigo; tú decides."}</p>
      ${admin?`<div style="margin:8px 0 4px"><button class="btn sm" id="recalc">Recalcular avisos</button></div>`:""}
      ${(av||[]).map(a=>`<div class="aviso"><div><div class="t"><span class="pill ${a.severidad}">${a.severidad}</span> <span class="tag">${esc(a.codigo)}</span> ${esc(a.titulo)}</div><div class="d">${esc(a.detalle||"")}</div><div class="d">Riesgo: <b class="mono">${eur(a.eur_riesgo)}</b> · estado <span class="pill ${a.estado}">${a.estado}</span></div></div>
        <div class="acts">${admin?estados.filter(([k])=>k!==a.estado).map(([k,l])=>`<button class="btn sm" data-a="${a.id}" data-e="${k}">${l}</button>`).join(""):""}</div></div>`).join("")||`<div class="msg">Sin avisos.</div>`}
    </div>
    <div class="card"><h2>Sorpresas de este evento</h2><p class="msg">Gastos que no estaban en el presupuesto. Son la materia prima del colchón del próximo plan.</p>
      <table><tr><th>Qué pasó</th><th>Quién lo paga</th><th class="n">€</th></tr>${(inc||[]).map(i=>`<tr><td>${esc(i.titulo)}<div class="meta" style="color:var(--tx2);font-size:12px">${esc(i.detalle||"")}</div></td><td>${asume[i.asume]||esc(i.asume)}</td><td class="n">${eur(i.importe_est)}</td></tr>`).join("")||`<tr><td colspan="3" class="msg">Ninguna registrada.</td></tr>`}</table>
    </div></div>`;
  panel.querySelectorAll("button[data-a]").forEach(b=> b.onclick = async ()=>{ b.disabled=true; const { error } = await sb.rpc("estado_aviso",{ aid:b.dataset.a, nuevo:b.dataset.e }); if(error) alert(error.message); tabMes(p,panel,admin); });
  const rc = $("#recalc"); if(rc) rc.onclick = async ()=>{ rc.disabled=true; const { data, error } = await sb.rpc("calcular_avisos",{ pid:p.id }); if(error) alert(error.message); else tabMes(p,panel,admin); };
}

async function tabLineas(p, panel, admin){
  const [{ data:ls, error:e1 }, { data:docs, error:e2 }] = await Promise.all([
    sb.from("lineas").select("*, documentos(numero,tipo)").eq("proyecto_id",p.id).order("tipo").order("importe",{ascending:false}),
    sb.from("documentos").select("*").eq("proyecto_id",p.id).order("fecha") ]);
  if(e1||e2) return panel.innerHTML=`<div class="card err">${esc((e1||e2).message)}</div>`;
  const compra = (ls||[]).filter(l=>l.tipo==="compra"), venta=(ls||[]).filter(l=>l.tipo==="venta");
  const tdoc = {presupuesto_proveedor:"Presupuesto proveedor",presupuesto_venta:"Presupuesto de venta",factura_recibida:"Factura recibida",factura_emitida:"Factura emitida",liquidacion:"Liquidación",otro:"Otro"};
  const row = l => `<tr><td>${esc(l.descripcion)}<div class="meta" style="color:var(--tx2);font-size:12px">${esc(l.familia)}${l.proveedor?" · "+esc(l.proveedor):""}${l.documentos?" · "+esc(l.documentos.numero):" · sin documento"}</div></td><td class="n">${l.cantidad} ${esc(l.unidad)} × ${l.dias} d</td><td class="n">${eur2(l.precio_unit)}</td><td class="n">${eur(l.importe)}</td></tr>`;
  panel.innerHTML = `<div class="card" style="margin-bottom:14px"><h2>Documentos (${docs?.length||0})</h2><table><tr><th>Tipo</th><th>Número</th><th>Fecha</th><th>Tercero</th><th class="n">Base</th><th class="n">Total</th><th>Estado</th></tr>${(docs||[]).map(d=>`<tr><td>${tdoc[d.tipo]||esc(d.tipo)}</td><td class="mono">${esc(d.numero||"")}</td><td>${fecha(d.fecha)}</td><td>${esc(d.tercero||"")}</td><td class="n">${eur2(d.base)}</td><td class="n">${eur2(d.total)}</td><td><span class="pill">${esc(d.estado)}</span></td></tr>`).join("")||`<tr><td colspan="7" class="msg">Ningún documento.</td></tr>`}</table>
  <p class="msg">Los archivos se guardan en un almacén privado por organización (bucket «documentos»). En v0 los vuelca Diego; en v1 los subirás tú desde aquí.</p></div>
  <div class="grid g2"><div class="card"><h2>Costes (${compra.length})</h2><table><tr><th>Partida</th><th class="n">Cant.</th><th class="n">Precio</th><th class="n">Importe</th></tr>${compra.map(row).join("")}</table></div>
  <div class="card"><h2>Ingresos (${venta.length})</h2><table><tr><th>Concepto</th><th class="n">Cant.</th><th class="n">Precio</th><th class="n">Importe</th></tr>${venta.map(row).join("")}</table></div></div>`;
}

boot();
</script>
</body>
</html>
