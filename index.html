:root{--bg:#0B0D26;--bg2:#121538;--bg3:#1A1E4A;--line:#262B5E;--tx:#E8EAF6;--tx2:#9DA3C7;--ac:#00E676;--ac2:#00B85C;--warn:#FFB300;--bad:#FF5252;--ok:#00E676;--r:12px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Space Grotesk",system-ui,sans-serif}
a{color:var(--ac)}button{font:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:5}
header .logo{font-weight:700;letter-spacing:.3px}header .logo b{color:var(--ac)}
header .sp{flex:1}header .who{color:var(--tx2);font-size:13px}
.btn{border:1px solid var(--line);background:var(--bg3);color:var(--tx);padding:8px 14px;border-radius:9px}
.btn:hover{border-color:var(--ac)}.btn.pri{background:var(--ac);color:#06281A;border-color:var(--ac);font-weight:700}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}.btn.ghost{background:transparent}
main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
h1{font-size:26px;margin:0 0 6px}h2{font-size:18px;margin:0 0 10px}h3{font-size:14px;margin:0 0 6px;color:var(--tx2);font-weight:500;text-transform:uppercase;letter-spacing:.6px}
.sub{color:var(--tx2);margin:0 0 18px}
.kpi{font-size:30px;font-weight:700;line-height:1.1}.kpi.small{font-size:22px}
.kpi .u{font-size:14px;color:var(--tx2);font-weight:400;margin-left:4px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mid{color:var(--warn)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{border:1px solid transparent;background:transparent;color:var(--tx2);padding:8px 14px;border-radius:9px;text-decoration:none}
.tab.on{background:var(--bg3);color:var(--tx);border-color:var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--tx2);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.5px}

.bar{height:8px;background:var(--bg3);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--tx2)}
.pill.alta{border-color:var(--bad);color:var(--bad)}.pill.media{border-color:var(--warn);color:var(--warn)}.pill.nota{color:var(--tx2)}
.pill.confirmado{border-color:var(--ok);color:var(--ok)}.pill.justificado,.pill.no_aplica{opacity:.6}
.aviso{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.aviso .t{font-weight:500}.aviso .d{color:var(--tx2);font-size:13px;margin-top:3px}
.aviso .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;justify-content:flex-end}
.list a.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--tx);text-decoration:none}
.list a.row:hover .nm{color:var(--ac)}.list .meta{color:var(--tx2);font-size:13px}
.demo{background:#2B2300;border:1px solid #6B5800;color:#FFD54F;padding:8px 12px;border-radius:9px;font-size:13px;margin-bottom:14px}
.login{max-width:440px;margin:70px auto}.login input{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:var(--bg3);color:var(--tx);font:inherit;margin:10px 0}
.msg{color:var(--tx2);font-size:13px;margin-top:8px}.err{color:var(--bad)}
.hook{font-size:13px;color:var(--tx2);border-left:3px solid var(--ac);padding-left:10px;margin:0 0 20px}
.crumb{color:var(--tx2);font-size:13px;margin-bottom:8px}.crumb a{color:var(--tx2);text-decoration:none}.crumb a:hover{color:var(--ac)}
.foot{color:var(--tx2);font-size:12px;margin-top:40px;border-top:1px solid var(--line);padding-top:12px}
.tag{font-size:11px;color:var(--tx2);font-family:"JetBrains Mono",monospace}
.frm label{display:block;font-size:13px;color:var(--tx2);margin:8px 0}
.frm input,.frm select,textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg3);color:var(--tx);font:inherit}
.frm label.chk{display:flex;align-items:center;gap:8px;color:var(--tx)}.frm label.chk input{width:auto;margin:0}
textarea{font-family:"JetBrains Mono",monospace;font-size:13px}
.frm button{margin-top:10px}
details summary{cursor:pointer}
@media (max-width:640px){.aviso{grid-template-columns:1fr}.aviso .acts{justify-content:flex-start}header{padding:10px 12px}.kpi{font-size:24px}}
